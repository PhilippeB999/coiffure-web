<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c3570"/>
      <stop offset="55%" stop-color="#6d2350"/>
      <stop offset="100%" stop-color="#3f1330"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e2a6"/>
      <stop offset="48%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#9c7d3f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fb"/>
      <stop offset="100%" stop-color="#c4ccd3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="60" fill="none" stroke="url(#brass)" stroke-width="13"/>

  <!-- bras (laiton) : anneau -> pivot -->
  <line x1="316" y1="378" x2="256" y2="206" stroke="url(#brass)" stroke-width="26" stroke-linecap="round"/>
  <line x1="196" y1="378" x2="256" y2="206" stroke="url(#brass)" stroke-width="26" stroke-linecap="round"/>
  <!-- anneaux -->
  <circle cx="196" cy="378" r="40" fill="none" stroke="url(#brass)" stroke-width="20"/>
  <circle cx="316" cy="378" r="40" fill="none" stroke="url(#brass)" stroke-width="20"/>
  <!-- lames (acier) -->
  <path d="M 243.9 210.7 L 210.0 86.0 L 268.1 201.3 Z" fill="url(#steel)" stroke="#5b6169" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 243.9 201.3 L 302.0 86.0 L 268.1 210.7 Z" fill="url(#steel)" stroke="#5b6169" stroke-width="4" stroke-linejoin="round"/>
  <!-- vis du pivot -->
  <circle cx="256" cy="206" r="15" fill="url(#brass)" stroke="#6f591f" stroke-width="4"/>
</svg>